# Builds a self-contained Lantern.dmg (Apple Silicon, macOS 26.2+, with Python 3.12, MLX and lantern-media
# bundled inside Lantern.app and ad-hoc signed) on GitHub's Apple Silicon macOS 26 runner.
# Runs on every `v*` tag (attaching Lantern.dmg to the GitHub Release) and on manual workflow_dispatch (uploading
# Lantern.dmg as a workflow artifact).
name: Build Lantern.dmg

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-26
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install Python 3.12 (uv managed, with sqlite load_extension) and dependencies
        run: |
          uv python install 3.12
          uv sync --python-preference only-managed

      - name: Build standalone Lantern.app and Lantern.dmg
        run: app/build.sh --dmg

      - name: Fast Python and Swift tests
        run: |
          DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer swift test --package-path app
          uv run pytest -q

      - name: Verify bundle is self-contained without .venv
        run: |
          mv .venv .venv.hidden
          PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 app/build/Lantern.app/Contents/Resources/python/bin/python3 -c "
          import importlib.util, sys
          assert importlib.util.find_spec('torch') is None
          import lantern, mlx.core, sqlite_vec, mlx_whisper, Vision, Quartz
          from lantern.embedding import siglip_vision, processor
          from lantern.models import catalogue
          assert len(catalogue()) == 4
          assert 'torch' not in sys.modules
          "
          mv .venv.hidden .venv
          codesign --verify --deep --strict app/build/Lantern.app
          ls -lh app/build/Lantern.dmg

      - name: Check that no bundled library needs a newer macOS than the app declares
        run: |
          # MLX's macOS 26 wheels need 26.2; a library above LSMinimumSystemVersion would load on no older system and
          # break search while the app still opens.
          MIN=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" app/build/Lantern.app/Contents/Info.plist)
          BAD=0
          while IFS= read -r -d '' f; do
            minos=$(otool -l "$f" 2>/dev/null | awk '/LC_BUILD_VERSION/{b=1} b&&/minos/{print $2; exit}')
            [ -z "$minos" ] && continue
            if [ "$(printf '%s\n%s\n' "$minos" "$MIN" | sort -V | tail -1)" != "$MIN" ]; then
              echo "needs macOS $minos > $MIN: $f"; BAD=1
            fi
          done < <(find app/build/Lantern.app -type f \( -name '*.so' -o -name '*.dylib' -o -perm -u+x \) -print0)
          exit $BAD

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Lantern.dmg
          path: app/build/Lantern.dmg

      - name: Attach Lantern.dmg to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: app/build/Lantern.dmg
          generate_release_notes: true

      - name: Update Homebrew tap
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_GITHUB_TOKEN not configured, skipping Homebrew tap update."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 app/build/Lantern.dmg | awk '{print $1}')
          echo "Updating Homebrew tap to version ${VERSION} (sha256: ${SHA})..."
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/misterekkk/homebrew-tap.git" tap
          cd tap
          python3 -c "
          import re
          path = 'Casks/lantern.rb'
          with open(path) as f:
              content = f.read()
          content = re.sub(r'version \".*?\"', f'version \"${VERSION}\"', content)
          content = re.sub(r'sha256 \".*?\"', f'sha256 \"${SHA}\"', content)
          with open(path, 'w') as f:
              f.write(content)
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/lantern.rb
          if ! git diff --staged --quiet; then
            git commit -m "Update Lantern to v${VERSION}"
            git push origin main
            echo "Successfully updated Homebrew tap to v${VERSION}!"
          else
            echo "No changes needed in Homebrew tap cask."
          fi
