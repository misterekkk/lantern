  <!-- Lantern's icon: a hand lantern on a graphite tile, its flame in warm amber with a glow in the glass, the one light
       in the dark. macOS icon grid: an 824 pt tile inside the 1024 pt canvas with continuous (squircle) corners, corner
       212. The lantern is centred on the tile (drawn at y 173-760, moved down 45.5). No rim (it showed as a light halo
       on dark backgrounds); svg2png.swift adds the drop shadow. The menu bar keeps a one-colour SF Symbol. Edit this
       file, then run scripts/icon/make-icons.sh: it writes every copy (app, website, demo, Raycast, Alfred). -->
