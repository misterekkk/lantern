[project]
name = "lantern"
version = "0.2.1"
description = "Local, offline semantic search over files, code, photos and recordings on macOS."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    # Embedding backend (ADR-001): MLX + pinned mlx-vlm branch with EmbeddingGemma 2.
    "mlx>=0.32.3",
    "mlx-vlm @ git+https://github.com/Blaizzy/mlx-vlm.git@3d87e88402f307efbf68e568971aa887ee7d9ed0",
    # Preprocessing via the model's numpy/PIL processor parts (embedding/processor.py; no torch).
    "transformers>=5.19",
    "pillow>=12",
    "numpy>=2",
    "soundfile>=0.14",
    # Store (ADR-002).
    "sqlite-vec>=0.1.9",
    "pathspec>=1.1.1",
    "tree-sitter-language-pack>=1.22.1",
    "charset-normalizer>=3.5.2",
    "tokenizers>=0.23.3",
    "mlx-whisper>=0.4.3",
    "watchdog>=6.0.0",
    "pyobjc-framework-vision>=11",
    "pyobjc-framework-quartz>=11",
]

[project.optional-dependencies]
# Fallback backend behind the same Embedder interface.
st = ["sentence-transformers>=6.1", "torch>=2.14", "torchvision>=0.29", "torchaudio", "soxr"]

[project.scripts]
lantern = "lantern.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]
# Phase 0 measurement scripts in spikes/phase0 (not part of the app).
spike = [
    "sentence-transformers>=6.1",
    "torch>=2.14",
    "torchvision>=0.29",
    "torchaudio",
    "soxr",
    "psutil",
    "requests",
    "audiomentations>=0.43.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["daemon/lantern"]

[tool.uv]
default-groups = ["dev"]
# mlx-whisper lists torch for its unused weight-conversion script; mlx-vlm lists opencv, server and audio packages for
# its CLI/server, while Lantern loads only its model modules (embedding/mlx_loader.py).
override-dependencies = [
    "torch ; extra == 'st'",
    "opencv-python ; sys_platform == 'never'",
    "fastapi ; sys_platform == 'never'",
    "uvicorn ; sys_platform == 'never'",
    "starlette ; sys_platform == 'never'",
    "websockets ; sys_platform == 'never'",
    "python-multipart ; sys_platform == 'never'",
    "mlx-audio ; sys_platform == 'never'",
    "llguidance ; sys_platform == 'never'",
    "miniaudio ; sys_platform == 'never'",
    "sentencepiece ; sys_platform == 'never'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs the real embedding model downloaded (slow)"]
addopts = "-m 'not model'"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/showcase/*" = ["E501"]  # SVG markup in f-strings reads better on one line

[tool.ruff.lint.isort]
known-first-party = ["lantern"]
